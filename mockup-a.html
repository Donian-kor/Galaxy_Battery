<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup A - Dark-first Material You</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #050810; }
  .phone { width: 360px; height: 780px; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 8px #1a1a2e, 0 30px 80px rgba(0,0,0,0.6); }
  .gauge-ring { stroke-dasharray: 251; stroke-dashoffset: 63; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8 font-sans">
  <div class="phone" style="background:#0A0E18;">
    <div class="h-full flex flex-col px-5 pt-10 pb-6">
      <!-- Status bar -->
      <div class="flex justify-between text-xs text-gray-400 mb-6">
        <span>9:41</span><span>●●● 100%</span>
      </div>
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-white">갤럭시 배터리 정보</h1>
          <p class="text-sm text-gray-400">SM-G991B · 2026-11-01</p>
        </div>
        <button class="w-10 h-10 rounded-full bg-[#111827] flex items-center justify-center text-gray-300">☰</button>
      </div>
      <!-- Gauge Card -->
      <div class="rounded-3xl p-6 mb-4" style="background:#111827;">
        <p class="text-xs text-gray-400 mb-4 tracking-widest">배터리 건강도</p>
        <div class="flex items-center justify-center mb-4">
          <svg width="160" height="160" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#1F2D42" stroke-width="8"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#00E5A0" stroke-width="8" stroke-linecap="round" class="gauge-ring" transform="rotate(-90 50 50)"/>
            <text x="50" y="46" text-anchor="middle" fill="#E8EEFF" font-size="22" font-weight="bold">87%</text>
            <text x="50" y="62" text-anchor="middle" fill="#7A8BA8" font-size="8">BSOH</text>
          </svg>
        </div>
        <div class="flex justify-between text-xs">
          <div class="text-center"><p class="text-gray-400">상태</p><p class="text-[#00E5A0] font-semibold">좋음</p></div>
          <div class="text-center"><p class="text-gray-400">사이클</p><p class="text-white font-semibold">312</p></div>
          <div class="text-center"><p class="text-gray-400">소스</p><p class="text-white font-semibold">BSOH</p></div>
        </div>
      </div>
      <!-- Cycle Card -->
      <div class="rounded-3xl p-5 mb-4" style="background:#111827;">
        <p class="text-xs text-gray-400 mb-2 tracking-widest">충전 사이클</p>
        <div class="flex items-end justify-between">
          <div>
            <p class="text-3xl font-bold text-white">312</p>
            <p class="text-xs text-gray-400">회 · 전체 충전 횟수 환산</p>
          </div>
          <div class="flex gap-1">
            <span class="px-2 py-1 rounded-full text-xs" style="background:#00E5A020;color:#00E5A0;">마모 없음</span>
          </div>
        </div>
      </div>
      <!-- Raw log entry -->
      <div class="rounded-3xl p-5" style="background:#111827;">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold text-white">dumpState_SM-G991B</p>
            <p class="text-xs text-gray-400">2026-11-01 09:00 · 캐시됨</p>
          </div>
          <button class="text-xs text-[#4DA6FF]">원본 보기</button>
        </div>
      </div>
      <div class="mt-auto pt-4 text-center">
        <p class="text-[10px] text-gray-600">A · Dark-first Material You</p>
      </div>
    </div>
  </div>
</body>
</html>
